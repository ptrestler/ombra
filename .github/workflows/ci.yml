# Browser tests cannot run on a Windows machine with Smart App Control enforced:
# it blocks Playwright's unsigned WebKit DLLs and the process dies at init with
# 0xC0000142. Linux runners have no such restriction, so CI is the reliable place
# to run `make test`. The OSM and elevation caches are committed, so the build
# needs no network fetch.
name: build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write          # the release step replaces the downloadable build
  pages: write             # ...and the deploy job publishes the site
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: make

      - name: Test
        run: make test

      # Handy when a run fails and you want to see what it built. Arrives as a
      # zip, and expires - the release below is the copy meant for humans.
      - name: Upload the standalone build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ombra-roma-html
          # version.txt travels with the page: the deployed copy polls it to
          # notice when a browser is holding a cached build
          path: |
            dist/ombra-roma.html
            dist/version.txt
          if-no-files-found: warn

      # The page is 5.3 MB of base64 over gzip, so it barely compresses and git
      # cannot delta it: committing each rebuild grew the repo by that much every
      # time. A release asset lives outside the history, so the download is always
      # the newest build and costs the repository nothing. One fixed tag, replaced
      # in place, so the URL never changes:
      #   https://github.com/ptrestler/ombra/releases/download/build/ombra-roma.html
      - name: Publish it as the downloadable build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view build >/dev/null 2>&1 || gh release create build             --title "Latest build"             --notes "The current standalone page, rebuilt on every push to main. One self-contained file: download it and open it in any browser. Works offline, and unlike the hosted artifact it can use your location."
          gh release upload build dist/ombra-roma.html --clobber

  # The page on a URL anyone can open. This is the copy to send people: it is a
  # top-level HTTPS document rather than a cross-origin iframe, so unlike the
  # hosted artifact it can use the visitor's location. Deployed from the build,
  # never committed, so it costs the repository nothing.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ombra-roma-html
          path: site

      # Pages serves index.html at the directory root; the build has one name.
      # version.txt sits beside it, already written by the build.
      - run: |
          mv site/ombra-roma.html site/index.html
          # without this the deployed page has nothing to poll, and a browser
          # sitting on a cached copy goes unnoticed. Fail loudly instead.
          test -s site/version.txt
          cat site/version.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
